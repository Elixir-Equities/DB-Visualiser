apiVersion: v1
kind: Secret
metadata:
  name: scylla-visualizer-ca
  namespace: ${NAMESPACE}
type: Opaque
data:
  CA_CERT: ${CA_CERT_B64}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scylla-visualizer-service
  namespace: ${NAMESPACE}
  labels:
    app: scylla-visualizer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scylla-visualizer-service
  template:
    metadata:
      labels:
        app: scylla-visualizer-service
    spec:
      containers:
        - name: scylla-visualizer-service
          image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 8000
              name: backend
          env:
            - name: INTERNAL_API_TOKEN
              value: "${INTERNAL_API_TOKEN}"
            - name: SCYLLA_CONTACT_POINTS
              value: "${SCYLLA_CONTACT_POINTS}"
            - name: SCYLLA_PORT
              value: "${SCYLLA_PORT}"
            - name: SCYLLA_USERNAME
              value: "${SCYLLA_USERNAME}"
            - name: SCYLLA_PASSWORD
              value: "${SCYLLA_PASSWORD}"
            - name: SCYLLA_SSL
              value: "${SCYLLA_SSL}"
            - name: CA_CERT
              valueFrom:
                secretKeyRef:
                  name: scylla-ca
                  key: CA_CERT
            - name: PFR_MASKED_KEYSPACES
              value: "${PFR_MASKED_KEYSPACES}"
            - name: APP_ENV
              value: "${APP_ENV}"
            # Read by nginx at startup for the CSP frame-ancestors header.
            # The frontend's own copy is baked in at image build time.
            - name: PARENT_ORIGIN
              value: "${PARENT_ORIGIN}"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8000"
            - name: LOG_LEVEL
              value: "${LOG_LEVEL}"
            - name: BACKEND_URL
              value: "${BACKEND_URL}"
          # Probes hit the backend's unauthenticated /api/v1/health directly.
          # It answers 200 whenever the process is serving (even if ScyllaDB
          # is degraded), so these detect a dead/hung backend, not a DB outage.
          # nginx needs no probe of its own: the entrypoint exits the
          # container if either process dies.
          #
          # Startup: the backend connects to ScyllaDB before serving, so allow
          # up to 2 minutes (24 x 5s) before liveness takes over.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              memory: "1240Mi"
              cpu: "50m"
            limits:
              memory: "1256Mi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: scylla-visualizer-service
  namespace: ${NAMESPACE}
  labels:
    app: scylla-visualizer-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: backend
      port: 8000
      targetPort: 8000
  selector:
    app: scylla-visualizer-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scylla-visualizer-hpa
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scylla-visualizer-service
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: 700m

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scylla-visualizer-pdb
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: scylla-visualizer-service
